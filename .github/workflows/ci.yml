name: build and check

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest

    # A job that hangs is worse than a job that fails: it stays amber for six
    # hours and nobody looks at it, while a red one sends an email.
    timeout-minutes: 15

    # A real SNMP agent, so the hand-written codec is checked against something
    # written by somebody else. Without this the simulator and the client agree
    # with each other about anything they both get wrong.
    services:
      snmpd:
        image: polinux/snmpd
        ports:
          - 16200:161/udp

    steps:
      - uses: actions/checkout@v4

      # Exactly the minimum the README claims.
      - uses: actions/setup-node@v4
        with:
          node-version: '20.11'
          cache: npm

      - run: npm ci

      - name: The parts
        run: npm test

      - name: The codec, against an agent nobody here wrote
        run: npm run check:snmp

      - name: The header mark and the tab icon are one drawing
        run: npm run check:mark

      - name: nobody can be served yesterday's page
        # A caching header is right in the source and wrong in the response
        # more often than anything else here: express.static's lastModified
        # is a SEPARATE option from etag and defaults to true, so turning off
        # only etag leaves the revalidation that serves a stale page.
        run: npm run check:serving

      - name: Drive the whole collector over HTTP
        # It starts its own fleet and its own collector, on a port nothing else
        # uses, and stops them again -- see tools/with-the-service.mjs.
        #
        # This step used to start both of them here, in shell, with a readiness
        # loop of its own. When the tool learned to do that properly the two
        # setups fought over the simulator UDP ports: the walkthrough fleet
        # exited 13, EADDRINUSE, and reported that the printers never came up.
        #
        # One setup, in one place, and it is the one a person runs too.
        run: npm run walkthrough

      # An assertion about what this is, that fails loudly if it stops being
      # true: one runtime dependency, and no `set` anywhere near a device.
      - name: One runtime dependency, and nothing that writes to a printer
        run: |
          node -e '
            const held = Object.keys(require("./package.json").dependencies ?? {});
            console.log("runtime dependencies:", held.join(", "));
            if (held.length !== 1 || held[0] !== "express") {
              console.error("Expected exactly express. If that is deliberate, say so in the README and change this.");
              process.exit(1);
            }
          '
          if grep -rn "TAG.SET\|SET_REQUEST\|0xa3" src/ ; then
            echo "Something in src/ looks like an SNMP set request. This service reads meters."
            exit 1
          fi
          echo "No set request anywhere in src/."
