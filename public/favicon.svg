<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none">
  <!--
    The same mark as the one inlined in index.html: a sheet with a level on it.
    Two files because a favicon is loaded outside the page and inherits none of
    its colours; `npm run check:mark` compares the geometry, because keeping two
    files in step by remembering is not a plan.
  -->
  <rect width="32" height="32" rx="7" fill="#1d2530"/>
  <rect x="9" y="6" width="14" height="20" rx="2.5" fill="#9fc4e8" opacity="0.35"/>
  <rect x="9" y="17" width="14" height="9" rx="2.5" fill="#9fc4e8"/>
</svg>
